name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish web/CqlWeb.csproj -c Release -o publicado
      # la pagina vive en /cql-interpreter/, no en la raiz del dominio
      - run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publicado/wwwroot/index.html
      # sin esto GitHub Pages ignora la carpeta _framework
      - run: touch publicado/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publicado/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
